name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Simpan log jika gagal
        if: failure()
        run: |
          mkdir -p logout && cp build.log logout/build.log || echo "no log" > logout/build.log
          cd logout
          git init -q -b buildlog
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add build.log
          git commit -qm "Log build gagal ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
      - name: Siapkan file APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/KaptenMeong.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KaptenMeong-apk
          path: out/KaptenMeong.apk
      - name: Simpan APK ke branch "apk"
        run: |
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add KaptenMeong.apk
          git commit -qm "APK dari ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
      - name: Rilis di GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Kapten Meong v2.0.${{ github.run_number }}
          files: out/KaptenMeong.apk
