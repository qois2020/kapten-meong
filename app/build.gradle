plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.kaptenmeong.sehat'
    compileSdk 34

    defaultConfig {
        applicationId "id.kaptenmeong.sehat"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    signingConfigs {
        release {
            // Kunci tetap: semua versi bertanda tangan sama, jadi update bisa ditimpa.
            storeFile file('kaptenmeong.jks')
            storePassword 'kaptenmeong2026'
            keyAlias 'meong'
            keyPassword 'kaptenmeong2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
